name: Upstream watch

# The connectors scrape stores that change without warning, and the failure mode is a claim that
# silently stops working. Other projects solving the same Epic problem meet those changes first,
# so what they change is an early warning we would otherwise get from our own failures — days
# later, with less to go on.
#
# Two sources, because they cover different ground:
#   - claabs/epicgames-freegames-node, by release: authentication, offers, EULA handling. It has
#     not clicked through checkout since v5 (2023) — it hands the operator a link instead — and
#     it ships from master, so its releases are rare.
#   - vogler/free-games-claimer, by commit to epic-games.js on its `dev` branch: the checkout
#     itself. Every 2026 checkout fix landed there (the "Add to library" rename, the new
#     confirmation texts) and never reached a release or `main`, which is why watching releases
#     alone missed all of them.
#
# This only opens an issue. Nothing here changes code: what upstream did still has to be read and
# judged against our own implementation, which is deliberately different in places.
on:
  schedule:
    - cron: "0 7 * * 1" # Monday morning, before the week's claims matter
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # There is no checkout here — nothing needs the code — so gh cannot infer which repository
      # the issue belongs to and falls back to reading git, which is not there. GH_REPO tells it
      # outright and keeps the job checkout-free.
      GH_REPO: ${{ github.repository }}
      UPSTREAM: claabs/epicgames-freegames-node
    steps:
      - name: Note any upstream release we have not seen
        run: |
          set -euo pipefail

          if ! gh release view --repo "$UPSTREAM" --json tagName,url,body > release.json 2>/dev/null; then
            echo "No readable release upstream; nothing to do."
            exit 0
          fi

          tag=$(jq -r .tagName release.json)
          url=$(jq -r .url release.json)
          title="Upstream $UPSTREAM released $tag"

          # Keyed on the title so a re-run, or a second release in a week, never duplicates.
          if gh issue list --search "$title in:title" --state all --json title --jq '.[].title' \
              | grep -Fxq "$title"; then
            echo "Already tracked: $title"
            exit 0
          fi

          # Built as a file rather than an inline heredoc: nesting one inside a YAML block scalar
          # indents its terminator, which bash then never matches — a failure that only shows up
          # at run time.
          {
            echo "[$tag]($url) is out upstream."
            echo
            echo "Worth reading against \`packages/connectors/src/epic/\`: that project solves the"
            echo "same problem and tends to meet Epic's changes first. A fix there often explains a"
            echo "claim of ours that is about to start failing, or already has, quietly."
            echo
            echo "Ours differs on purpose in places — the promotions feed, the pinned en-US locale,"
            echo "the ownership check — so this is a prompt to compare, not to copy."
            echo
            echo "<details><summary>Upstream release notes</summary>"
            echo
            jq -r '.body // "(no notes)"' release.json | head -c 4000
            echo
            echo "</details>"
          } > issue.md

          gh issue create --title "$title" --body-file issue.md

      - name: Note any change to vogler/free-games-claimer's Epic checkout
        env:
          CHECKOUT_UPSTREAM: vogler/free-games-claimer
          CHECKOUT_BRANCH: dev
          CHECKOUT_FILE: epic-games.js
        run: |
          set -euo pipefail

          # A little more than the weekly schedule, so a commit landing just before a run is not
          # missed by the next one; the title key below keeps the overlap from duplicating.
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          if ! gh api "repos/$CHECKOUT_UPSTREAM/commits?sha=$CHECKOUT_BRANCH&path=$CHECKOUT_FILE&since=$since&per_page=20" \
              > commits.json 2>/dev/null; then
            echo "Could not read $CHECKOUT_UPSTREAM commits; nothing to do."
            exit 0
          fi

          count=$(jq 'length' commits.json)
          if [ "$count" -eq 0 ]; then
            echo "No change to $CHECKOUT_FILE on $CHECKOUT_BRANCH since $since."
            exit 0
          fi

          newest=$(jq -r '.[0].sha[0:7]' commits.json)
          title="Upstream $CHECKOUT_UPSTREAM changed $CHECKOUT_FILE ($newest)"
          if gh issue list --search "$title in:title" --state all --json title --jq '.[].title' \
              | grep -Fxq "$title"; then
            echo "Already tracked: $title"
            exit 0
          fi

          {
            echo "\`$CHECKOUT_FILE\` changed on \`$CHECKOUT_BRANCH\` upstream ($count commit(s) since $since)."
            echo
            echo "This is where Epic checkout fixes land first. Compare against"
            echo "\`packages/connectors/src/epic/checkout.ts\` and \`driver.ts\`: a change here often"
            echo "means a claim of ours is about to start failing, or already has."
            echo
            jq -r '.[] | "- [\(.sha[0:7])](\(.html_url)) \(.commit.author.date[0:10]) — \(.commit.message | split("\n")[0])"' commits.json
          } > issue.md

          gh issue create --title "$title" --body-file issue.md
