name: Publish image

# Builds the application image and publishes it to GitHub Container Registry, so a deployment can
# pull it instead of building on the target host. That matters for a NAS: the Next build plus the
# workspace install is heavy, and Portainer cannot build from a pasted compose file at all — it
# has no build context, only `image:` references.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/Dockerfile.*"
      - "deploy/entrypoint.mjs"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the owner: GHCR rejects an image name with capitals, and GitHub usernames
      # commonly have them.
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/uc-app" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          # x86_64 only: the CloakBrowser build the worker downloads is amd64.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
