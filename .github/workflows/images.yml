name: Publish image

# Builds the application image and publishes it to GitHub Container Registry, so a deployment can
# pull it instead of building on the target host. That matters for a NAS: the Next build plus the
# workspace install is heavy, and Portainer cannot build from a pasted compose file at all — it
# has no build context, only `image:` references.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/Dockerfile.*"
      - "deploy/entrypoint.mjs"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: this job publishes the release that tells a deployment an update exists.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the owner: GHCR rejects an image name with capitals, and GitHub usernames
      # commonly have them.
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/uc-app" >> "$GITHUB_OUTPUT"

      # A version is one merge to main. Date-ordered so a human can tell at a glance which of two
      # is newer, with the sha so it points at an exact commit.
      - name: Compute version and patch note
        id: ver
        run: |
          echo "version=v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # A `Patch note:` line in the merge commit is what the operator reads in the app. The
          # commit subject is the fallback: better a terse accurate line than an empty release.
          note=$(git log -1 --pretty=%B | sed -n 's/^Patch note:[[:space:]]*//p' | head -1)
          [ -z "$note" ] && note=$(git log -1 --pretty=%s)
          {
            echo "note<<PATCHNOTE_EOF"
            echo "$note"
            echo "PATCHNOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          # x86_64 only: the CloakBrowser build the worker downloads is amd64.
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Created only after a successful push, and that ordering is the point: the app treats a
      # release as "an update you can install", so one must never exist for an image that does not.
      - name: Publish the release
        if: github.ref_name == 'main'
        # Both values arrive as environment variables rather than being interpolated into the
        # command with ${{ }}. Interpolation pastes the text into the script before the shell
        # parses it, so a note containing a quote — `"Update now"` did exactly this — terminates
        # the string early, and a crafted commit message could run arbitrary commands on the
        # runner. As env vars the shell sees ordinary values it never re-parses.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTE: ${{ steps.ver.outputs.note }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTE"
