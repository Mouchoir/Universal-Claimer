# Minimal, self-contained stack: `docker compose up` from this directory (after creating
# deploy/.env from .env.example) is all that is needed. One user per deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uc
      POSTGRES_PASSWORD: uc
      POSTGRES_DB: uc
    volumes:
      - uc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations + seed before web/worker start.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://uc:uc@postgres:5432/uc
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      DATABASE_URL: postgres://uc:uc@postgres:5432/uc
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in deploy/.env}
      PORT: 8080
      # Headless deployment: relay the login page into the wizard over the CDP screencast
      # WebSocket (docs/design/cdp-relay.md). RELAY_TOKEN guards the internal worker→web leg.
      LOGIN_RELAY_EMBED: "true"
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN in deploy/.env}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://uc:uc@postgres:5432/uc
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in deploy/.env}
      # Start the CDP screencast relay and connect to the web's WebSocket bridge by service name.
      LOGIN_RELAY_EMBED: "true"
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN in deploy/.env}
      RELAY_INTERNAL_URL: ws://web:8080
    # x86_64 host required (CloakBrowser binary). Runs the browser headed under Xvfb.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  uc_pgdata:
