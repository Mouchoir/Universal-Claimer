# Minimal, self-contained stack: `docker compose up` from this directory (after creating
# deploy/.env from .env.example) is all that is needed. One user per deployment.
#
# Two services on purpose. The portal, the claim worker and the schema migrations all live in the
# `app` container (deploy/entrypoint.mjs runs them in order); postgres stays separate because a
# database wants its own lifecycle — backups, restores and major-version upgrades that do not
# move in lockstep with the application image.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uc
      POSTGRES_PASSWORD: uc
      POSTGRES_DB: uc
    volumes:
      - uc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    environment:
      DATABASE_URL: postgres://uc:uc@postgres:5432/uc
      PORT: 8080
      # Headless deployment: relay the login page into the wizard over the CDP screencast
      # WebSocket (docs/design/cdp-relay.md). RELAY_TOKEN guards the internal worker→web leg,
      # which is a loopback connection now that both run here.
      LOGIN_RELAY_EMBED: "true"
      # APP_ENCRYPTION_KEY and RELAY_TOKEN are deliberately absent: the app generates them on
      # first boot and keeps them in the uc_config volume. Pinning them here still works and
      # takes precedence, but leaving them out is what makes an update unable to lose them.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      # The updater below. Point this at a Portainer stack webhook instead if you prefer — then
      # set UPDATE_WEBHOOK_METHOD to POST, which is what Portainer expects.
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-http://updater:8080/v1/update}
      UPDATE_WEBHOOK_METHOD: ${UPDATE_WEBHOOK_METHOD:-GET}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-universal-claimer-updater}
    labels:
      # Marks this container as the one the updater manages. Postgres deliberately has no such
      # label: its tag is pinned, and a database is not something to restart on a timer.
      com.centurylinklabs.watchtower.scope: universal-claimer
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Generated secrets. Losing this volume loses the encryption key, and with it every stored
      # account session — the app refuses to start on a mismatch rather than failing quietly.
      - uc_config:/var/lib/uc
      # The ~200MB Chromium is downloaded on first boot; keep it across redeploys.
      - uc_browser:/var/lib/cloakbrowser
    depends_on:
      postgres:
        condition: service_healthy
    # x86_64 host required (CloakBrowser binary). Runs the browser headed under Xvfb.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: the first boot downloads the browser before the portal starts listening.
      start_period: 180s
    restart: unless-stopped

  # Applies updates, and nothing else. A container cannot recreate itself, so something with
  # access to the Docker daemon has to do it — and that access is why this is a separate service
  # rather than a socket mounted into `app`. This one has no exposed port, no dependencies of its
  # own, and one job; `app` is a public-facing server with a large dependency tree, and handing
  # that the host's daemon is a much larger bet for the same feature.
  #
  # `--scope` confines it to containers carrying the matching label, so it manages this stack's
  # app and nothing else on the host.
  updater:
    image: containrrr/watchtower:1.7.1
    environment:
      WATCHTOWER_SCOPE: universal-claimer
      # Poll on a schedule so updates land without anyone clicking anything. Set to 0 to disable
      # and rely on the dashboard button alone.
      WATCHTOWER_POLL_INTERVAL: ${UPDATE_INTERVAL_SECONDS:-21600}
      # The dashboard's "Update now" button calls this. Periodic polls stay on alongside it.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      # Guards an endpoint that is only reachable from inside this stack's own network, and whose
      # single power is "update this stack". Override it if you like; the default is not a secret
      # so much as a formality the API requires.
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATE_TOKEN:-universal-claimer-updater}
      # Old image layers are large; without this a NAS fills up over a few updates.
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  uc_pgdata:
  uc_config:
  uc_browser:
